<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không Tìm Thấy Trang - CỘI</title>
  <meta name="theme-color" content="#1E3A2F">
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, rgba(197, 160, 89, 0.1) 0%, transparent 70%);
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 10rem);
      color: var(--color-accent);
      line-height: 1;
      font-weight: 700;
    }
    .error-title {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }
    .error-desc {
      max-width: 480px;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Trang không tồn tại</h1>
      <p class="error-desc">Đường dẫn bạn vừa truy cập có thể đã được dời đi hoặc không còn tồn tại trên CỘI.</p>
      <a href="./index.html" class="btn btn--primary">Quay Về Trang Chủ</a>
    </div>
  </div>
</body>
</html>
