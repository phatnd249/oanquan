<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không Tìm Thấy Trang - 404 | CỘI</title>
  <meta name="theme-color" content="#1E3A2F">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #FBF9F5;
      color: #1D231F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, rgba(197, 160, 89, 0.12) 0%, #FBF9F5 70%);
    }
    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(5rem, 15vw, 9rem);
      color: #C5A059;
      line-height: 1;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      color: #12241D;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: #647067;
      max-width: 480px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      background: #1E3A2F;
      color: #FBF9F5;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(30, 58, 47, 0.25);
    }
    .btn:hover {
      background: #2D5545;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 58, 47, 0.35);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Trang Không Tồn Tại</h1>
    <p class="error-desc">Đường dẫn bạn truy cập có thể đã thay đổi hoặc không tồn tại trên hệ thống CỘI.</p>
    <a href="./" class="btn">Quay Về Trang Chủ</a>
  </div>
</body>
</html>
