<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12241D"/>
      <stop offset="60%" stop-color="#1E3A2F"/>
      <stop offset="100%" stop-color="#2D5545"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="600" cy="315" r="450" fill="url(#goldGlow)"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#C5A059" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Emblem -->
    <circle cx="600" cy="220" r="60" fill="#1E3A2F" stroke="#C5A059" stroke-width="3"/>
    <text x="600" y="240" font-family="Georgia, serif" font-size="54" font-weight="bold" fill="#C5A059">C</text>

    <!-- Brand Name -->
    <text x="600" y="360" font-family="Georgia, serif" font-size="76" font-weight="bold" fill="#FBF9F5" letter-spacing="8">CỘI</text>

    <!-- Tagline -->
    <text x="600" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#C5A059" letter-spacing="3">TINH HOA BẢN SẮC &amp; DI SẢN THUẦN VIỆT</text>

    <text x="600" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#D0DDD5" opacity="0.8">Gìn giữ và tôn vinh những giá trị truyền thống bền vững</text>
  </g>
</svg>
