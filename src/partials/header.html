<header class="header" id="header">
  <div class="container header__nav">
    <!-- Logo CỘI nền trong suốt (Horizontal Lockup) -->
    <a href="#hero" class="header__logo" aria-label="Trang chủ CỘI">
      <img data-asset="logoNav" src="./src/assets/images/branding/logo-nav.png" alt="Logo CỘI" class="header__logo-img">
    </a>

    <!-- Desktop Navigation Links (Căn giữa) -->
    <nav class="nav__menu" id="nav-menu" aria-label="Thanh điều hướng chính">
      <ul class="nav__links">
        <li><a href="#product" class="nav__link">Khám Phá Bộ Cờ</a></li>
        <li><a href="#rules" class="nav__link">Cách Chơi</a></li>
        <li><a href="#characters" class="nav__link">Nhân Vật</a></li>
        <li><a href="#gacha" class="nav__link">Mua Online</a></li>
        <li><a href="#about" class="nav__link">Về CỘI</a></li>
        <li><a href="#faq" class="nav__link">FAQ</a></li>
      </ul>
      <!-- Nút trong mobile drawer -->
      <div class="nav__drawer-cta">
        <button
          class="btn btn--outline"
          style="width: 100%;"
          data-modal-open="contact-modal"
        >Đăng Ký Tư Vấn</button>
        <a href="#gacha" class="btn btn--accent" style="width: 100%;">Đặt Mua Ngay</a>
      </div>
    </nav>

    <!-- Header Actions (Bên phải): Nút Tư Vấn, Đặt Mua & Hamburger -->
    <div class="header__action">
      <!-- Nút mở Popup Modal Tư Vấn -->
      <button
        class="btn btn--outline header__consult-btn"
        id="nav-cta-consult"
        data-modal-open="contact-modal"
        aria-label="Mở form đăng ký tư vấn"
      >
        <span>Tư Vấn Ngay</span>
      </button>

      <a href="#gacha" class="btn btn--accent header__buy-btn" id="nav-cta-buy">
        <span>Đặt Mua Ngay</span>
      </a>

      <!-- Hamburger Menu Mobile Button -->
      <button class="nav__toggle" id="nav-toggle" aria-label="Mở thực đơn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
